# Makes lite/ its own pnpm root, so an install here never walks up into the DFAI workspace.
packages: []
# The markdown writer's handlers (src/adapters/markdown) are written against
# mdast-util-to-markdown 2.1, as DFAI's are: 2.2 rewrote how emphasis and
# strikethrough encode the characters beside them.
overrides:
  mdast-util-to-markdown: 2.1.2
allowBuilds:
  esbuild: false
